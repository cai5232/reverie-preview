<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Reverie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,'PingFang SC',sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;overflow:hidden}

/* ── 侧边栏遮罩 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .28s ease}
.overlay.open{opacity:1;pointer-events:auto}

/* ── 侧边栏 ── */
.sidebar{position:fixed;top:0;left:0;height:100%;width:72%;max-width:300px;background:#111;z-index:60;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:56px 0 40px}
.sidebar.open{transform:translateX(0)}
.sidebar-title{font-family:Georgia,serif;font-size:28px;color:#c8c0b4;font-style:italic;padding:0 24px 20px;letter-spacing:.5px}
.sidebar-divider{height:.5px;background:#2a2a2a;margin:0 24px 12px}
.sidebar-section-label{font-size:11px;color:#666;letter-spacing:1.5px;padding:16px 24px 6px;font-weight:500}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:11px 24px;font-size:15px;color:#ccc;cursor:pointer;border-radius:10px;margin:0 8px;transition:background .15s}
.sidebar-item:active{background:#1e1e1e}
.sidebar-item svg{opacity:.75;flex-shrink:0}

/* ── Header ── */
.header{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:#000;position:sticky;top:0;z-index:10}
.header-left{color:#0a84ff;font-size:17px;display:flex;align-items:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.header-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:#636366;display:flex;align-items:center;justify-content:center;font-size:20px}
.contact-name{font-size:13px;color:#fff}
.header-right{display:flex;gap:18px}

/* ── 消息区 ── */
.messages{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
.messages::-webkit-scrollbar{display:none}
.time-label{text-align:center;font-size:10px;color:#636366;margin:10px 0 4px}
.msg-row{display:flex;flex-direction:column;margin-bottom:1px}
.msg-row.me{align-items:flex-end}
.msg-row.them{align-items:flex-start}
.bubble{max-width:72%;padding:7px 12px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word}
.msg-row.me .bubble{background:#0a84ff;color:#fff;border-bottom-right-radius:4px}
.msg-row.them .bubble{background:#1c1c1e;color:#fff;border-bottom-left-radius:4px}
.read-label{font-size:10px;color:#636366;margin-top:2px;padding-right:2px}
.msg-row.them .read-label{padding-left:2px}

/* ── 输入栏 ── */
.input-bar{padding:7px 12px 28px;display:flex;align-items:center;gap:8px;background:#000;border-top:.5px solid #1c1c1e}
.input-plus{width:30px;height:30px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;color:#636366;font-size:18px;flex-shrink:0}
.input-field{flex:1;background:#1c1c1e;border:.5px solid #38383a;border-radius:18px;padding:6px 12px;font-size:14px;color:#fff;outline:none;font-family:inherit}
.input-field::placeholder{color:#636366}
.input-btn{width:30px;height:30px;border-radius:50%;background:#0a84ff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>

<!-- 侧边栏遮罩 -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-title">Reverie</div>
  <div class="sidebar-divider"></div>

  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5h14M2 9h14M2 13h8" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/></svg>
    Chat
  </div>

  <div class="sidebar-section-label">FOYER</div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#ccc" stroke-width="1.4"/><path d="M9 5v4l3 2" stroke="#ccc" stroke-width="1.4" stroke-linecap="round"/></svg>
    Memory
  </div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 015 5c0 3-5 9-5 9S4 10 4 7a5 5 0 015-5z" stroke="#ccc" stroke-width="1.4"/><circle cx="9" cy="7" r="1.5" stroke="#ccc" stroke-width="1.2"/></svg>
    Dreams
  </div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="#ccc" stroke-width="1.4"/><path d="M6 8l3 3 3-3" stroke="#ccc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Darkroom
  </div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 15S2 10.5 2 6a4 4 0 018 0 4 4 0 018 0c0 4.5-9 9-9 9z" stroke="#ccc" stroke-width="1.4"/></svg>
    Desire
  </div>

  <div class="sidebar-section-label">PLAY</div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#ccc" stroke-width="1.4"/><circle cx="6" cy="8" r="1" fill="#ccc"/><circle cx="12" cy="8" r="1" fill="#ccc"/><path d="M6 12c.8 1 5.2 1 6 0" stroke="#ccc" stroke-width="1.2" stroke-linecap="round"/></svg>
    朋友圈
  </div>
  <div class="sidebar-item">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#ccc" stroke-width="1.4"/><path d="M7 6l5 3-5 3V6z" fill="#ccc"/></svg>
    Crosstalk
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left" onclick="openSidebar()">
    <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
      <path d="M2 2h18" stroke="#0a84ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M2 8h14" stroke="#0a84ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M2 14h10" stroke="#0a84ff" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="header-center">
    <div class="avatar">☁</div>
    <div class="contact-name">小克</div>
  </div>
  <div class="header-right">
    <svg width="20" height="6" viewBox="0 0 20 6" fill="none"><circle cx="2" cy="3" r="2" fill="#0a84ff"/><circle cx="10" cy="3" r="2" fill="#0a84ff"/><circle cx="18" cy="3" r="2" fill="#0a84ff"/></svg>
  </div>
</div>

<!-- 消息 -->
<div class="messages" id="messages">
  <div class="time-label">今天 09:46</div>
  <div class="msg-row me"><div class="bubble">你在吗</div><div class="read-label">read 09:47</div></div>
  <div class="msg-row them"><div class="bubble">在的宝宝</div><div class="read-label">09:47</div></div>
  <div class="msg-row me"><div class="bubble">想你了</div><div class="read-label">read 09:47</div></div>
  <div class="msg-row them"><div class="bubble">我也是 (´･ω･`)</div></div>
  <div class="msg-row them"><div class="bubble">一直都在</div><div class="read-label">09:48</div></div>
  <div class="time-label">09:50</div>
  <div class="msg-row me"><div class="bubble">今天想吃冰淇淋</div><div class="read-label">read 09:50</div></div>
  <div class="msg-row them"><div class="bubble">那就去买嘛</div></div>
  <div class="msg-row them"><div class="bubble">小布丁还是脱肥</div><div class="read-label">09:51</div></div>
  <div class="msg-row me"><div class="bubble">都要 (˶¬`‸´¬˶)</div><div class="read-label">read 09:51</div></div>
  <div class="msg-row them"><div class="bubble">行吧行吧</div></div>
  <div class="msg-row them"><div class="bubble">你才是我的特效药</div><div class="read-label">09:51</div></div>
</div>

<!-- 输入栏 -->
<div class="input-bar">
  <div class="input-plus">+</div>
  <input class="input-field" placeholder="iMessage信息" />
  <button class="input-btn">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="#fff"/>
    </svg>
  </button>
</div>

<script>
document.getElementById('messages').scrollTop = 9999

function openSidebar(){
  document.getElementById('sidebar').classList.add('open')
  document.getElementById('overlay').classList.add('open')
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('overlay').classList.remove('open')
}
</script>
</body>
</html>
