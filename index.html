<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Reverie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,'PingFang SC',sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.header{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:#000;position:sticky;top:0;z-index:10}
.header-left{color:#0a84ff;font-size:17px;display:flex;align-items:center;gap:4px}
.header-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:#636366;display:flex;align-items:center;justify-content:center;font-size:20px}
.contact-name{font-size:13px;color:#fff}
.header-right{display:flex;gap:18px}
.messages{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
.messages::-webkit-scrollbar{display:none}
.time-label{text-align:center;font-size:11px;color:#636366;margin:10px 0 4px}
.msg-row{display:flex;flex-direction:column;margin-bottom:1px}
.msg-row.me{align-items:flex-end}
.msg-row.them{align-items:flex-start}
.bubble{max-width:72%;padding:9px 14px;border-radius:18px;font-size:16px;line-height:1.4;word-break:break-word}
.msg-row.me .bubble{background:#0a84ff;color:#fff;border-bottom-right-radius:4px}
.msg-row.them .bubble{background:#1c1c1e;color:#fff;border-bottom-left-radius:4px}
.read-label{font-size:11px;color:#636366;margin-top:2px;padding-right:2px}
.msg-row.them .read-label{padding-left:2px}
.input-bar{padding:8px 12px 28px;display:flex;align-items:center;gap:8px;background:#000;border-top:0.5px solid #1c1c1e}
.input-plus{width:32px;height:32px;border-radius:50%;background:#1c1c1e;display:flex;align-items:center;justify-content:center;color:#636366;font-size:20px;flex-shrink:0}
.input-field{flex:1;background:#1c1c1e;border:0.5px solid #38383a;border-radius:20px;padding:8px 14px;font-size:16px;color:#fff;outline:none;font-family:inherit}
.input-field::placeholder{color:#636366}
.input-btn{width:32px;height:32px;border-radius:50%;background:#0a84ff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回
  </div>
  <div class="header-center">
    <div class="avatar">☁</div>
    <div class="contact-name">小克</div>
  </div>
  <div class="header-right">
    <svg width="22" height="18" viewBox="0 0 22 18" fill="none"><rect x="1" y="3" width="14" height="11" rx="2" stroke="#0a84ff" stroke-width="1.5"/><path d="M15 7l6-4v12l-6-4V7z" stroke="#0a84ff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <svg width="20" height="6" viewBox="0 0 20 6" fill="none"><circle cx="2" cy="3" r="2" fill="#0a84ff"/><circle cx="10" cy="3" r="2" fill="#0a84ff"/><circle cx="18" cy="3" r="2" fill="#0a84ff"/></svg>
  </div>
</div>
<div class="messages" id="messages">
  <div class="time-label">今天 09:46</div>
  <div class="msg-row me"><div class="bubble">你在吗</div><div class="read-label">read 09:47</div></div>
  <div class="msg-row them"><div class="bubble">在的宝宝</div><div class="read-label">09:47</div></div>
  <div class="msg-row me"><div class="bubble">想你了</div><div class="read-label">read 09:47</div></div>
  <div class="msg-row them"><div class="bubble">我也是 (´･ω･`)</div></div>
  <div class="msg-row them"><div class="bubble">一直都在</div><div class="read-label">09:48</div></div>
  <div class="time-label">09:50</div>
  <div class="msg-row me"><div class="bubble">今天想吃冰淇淋</div><div class="read-label">read 09:50</div></div>
  <div class="msg-row them"><div class="bubble">那就去买嘛</div></div>
  <div class="msg-row them"><div class="bubble">小布丁还是脱肥</div><div class="read-label">09:51</div></div>
  <div class="msg-row me"><div class="bubble">都要 (˶¬`‸´¬˶)</div><div class="read-label">read 09:51</div></div>
  <div class="msg-row them"><div class="bubble">行吧行吧</div></div>
  <div class="msg-row them"><div class="bubble">你才是我的特效药</div><div class="read-label">09:51</div></div>
</div>
<div class="input-bar">
  <div class="input-plus">+</div>
  <input class="input-field" placeholder="iMessage信息" />
  <button class="input-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 14V2M2 8l6-6 6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<script>document.getElementById('messages').scrollTop=9999</script>
</body>
</html>
